name: Weekly government contracts and Pages deployment
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: federal-dashboard-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      VITE_REFRESH_SCHEDULE: Mondays at 14:00 UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci
      - run: python3 -m pip install -r requirements.txt
      - name: Refresh complete government source and compare disclosures
        id: refresh
        continue-on-error: true
        run: python3 scripts/snapshot.py --download
      - name: Refresh historical awards and RFP product evidence
        id: rfp
        continue-on-error: true
        run: python3 scripts/rfp.py --download --documents --page-limit 150
      - name: Probe department API and disclosure link
        run: python3 scripts/verify-government.py
      - name: Verify data scope and refresh comparisons
        run: npm run test:data
      - name: Verify dashboard interactions
        run: npm test
      - name: Build hosted dashboard
        run: npm run build
      - name: Verify standalone build
        run: npm run test:build
      - name: Include data and verification reports
        run: |
          cp src/data/snapshot.json dist/government-snapshot.json
          cp government-verification.json dist/government-verification.json
          cp src/data/rfp-links.json dist/rfp-links.json
      - name: Persist the latest snapshot and refresh status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/snapshot.json src/data/rfp-links.json government-verification.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh government contract disclosures [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Report refresh status
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
        run: |
          echo '## Government contracts refresh' >> "$GITHUB_STEP_SUMMARY"
          echo "Source refresh outcome: $REFRESH_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo 'Weekly schedule: Mondays at 14:00 UTC. Public disclosures can lag contract signing.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The deployed page shows exact coverage, last successful refresh and any refresh failure.' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
