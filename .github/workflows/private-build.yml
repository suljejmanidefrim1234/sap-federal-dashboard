name: Private dashboard build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_government_data:
        description: Attempt a complete government resource download for this build
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci
      - name: Attempt actual government snapshot
        if: github.event_name == 'push' || inputs.refresh_government_data
        id: snapshot
        continue-on-error: true
        run: python3 scripts/snapshot.py --download
      - name: Verify data rules
        run: npm run test:data
      - name: Verify dashboard interactions
        run: npm test
      - name: Build private downloadable dashboard
        run: npm run build
      - name: Verify standalone private build
        run: npm run test:build
      - name: Include snapshot for import and audit
        run: cp src/data/snapshot.json dist/government-snapshot.json
      - uses: actions/upload-artifact@v4
        with:
          name: private-federal-dashboard
          path: dist/
          retention-days: 90
      - name: Write build status
        run: |
          echo '## Private dashboard build' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the private-federal-dashboard artifact and open dashboard.html.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect government-snapshot.json for coverage, refresh date, completeness and any collection errors.' >> "$GITHUB_STEP_SUMMARY"
